name: Generate NikGapps Config

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create nikgapps.config
        run: |
          cat <<EOF > nikgapps.config
          # NikGapps Configuration - Full Google (No Pixel Stuff)
          # Generated by GitHub Actions
          
          Core=1
          ExtraFiles=1
          GooglePlayStore=1
          GoogleServicesFramework=1
          GoogleAccountManager=1
          GoogleCalendarSyncAdapter=1
          GoogleContactsSyncAdapter=1
          DigitalWellbeing=1
          GoogleMessages=1
          GoogleDialer=1
          GoogleContacts=1
          GoogleClock=1
          GooglePhotos=1
          GoogleCalendar=1
          GoogleKeep=1
          GoogleMaps=1
          GoogleNews=1
          GoogleFiles=1
          GoogleCalculator=1
          GoogleRecorder=1
          GoogleDrive=1
          GoogleChrome=1
          GoogleGmail=1
          GoogleSearch=1
          GoogleMarkup=1
          GoogleWallpapers=1
          GoogleAssistant=1
          GoogleVoice=1
          YouTube=1
          YouTubeMusic=1
          GooglePlayGames=1
          GoogleTTS=1
          GBoard=1
          AndroidAuto=1
          GoogleSoundAmplifier=1
          GoogleAccessibilityMenu=1
          GoogleLiveTranscribe=1
          GoogleSpeechServices=1
          GooglePrintService=1
          GooglePrivateComputeServices=1
          CarrierServices=1
          DeviceHealthServices=1
          DevicePersonalizationServices=1
          GoogleFeedback=1
          GooglePartnerSetup=1
          GoogleRestore=1
          SetupWizard=1
          Velvet=1

          # Pixel Specifics (Disabled)
          PixelExtras=0
          PixelLauncher=0
          PixelThemes=0
          PixelIcons=0
          PixelStudio=0
          AICore=0
          EOF

      - name: Upload Config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nikgapps-config
          path: nikgapps.config
